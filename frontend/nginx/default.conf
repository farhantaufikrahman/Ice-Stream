# Konfigurasi nginx untuk frontend Ice-Stream (single-page app React).
# Dokumentasi: https://nginx.org/en/docs/http/ngx_http_core_module.html#try_files
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Jangan tampilkan versi nginx di header dan halaman error.
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Dipakai readinessProbe dan livenessProbe di Kubernetes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api dilayani Service api (diarahkan Gateway). Jika request /api nyasar
    # ke sini, jawab 404, jangan halaman HTML yang membingungkan.
    location /api/ {
        return 404;
    }

    # File hasil build Vite punya hash di namanya (index-D4vF-ZZE.js), jadi
    # aman disimpan browser selama setahun: isi baru = nama baru.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Semua alamat lain (/watch/42, /channel/budi, ...) dijawab index.html,
    # lalu React Router yang memilih halamannya. no-cache: browser selalu
    # bertanya dulu, supaya versi baru langsung terpakai setelah deploy.
    # (add_header di dalam location menggantikan yang di luar, jadi header
    # keamanan ditulis ulang di setiap location.)
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
