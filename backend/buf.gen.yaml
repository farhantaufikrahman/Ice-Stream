# Konfigurasi `buf generate`: membuat kode Go dari file .proto ke folder gen/.
# Dokumentasi: https://buf.build/docs/configuration/v2/buf-gen-yaml
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/farhantaufikrahman/ice-stream/backend/gen
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt: paths=source_relative
