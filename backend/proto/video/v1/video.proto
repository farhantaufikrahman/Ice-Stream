syntax = "proto3";

// Kontrak gRPC VideoService. Seperti AuthService, hanya dipanggil oleh API
// gateway dari dalam cluster. Gateway yang memeriksa access token, lalu
// mengirim id user yang sudah terverifikasi di field requester_id/viewer_id.
package video.v1;

import "google/protobuf/timestamp.proto";

service VideoService {
  // CreateUpload mencatat video baru (status PENDING_UPLOAD) dan memberi URL
  // presigned untuk mengunggah file langsung dari browser ke object storage.
  // Error INVALID_ARGUMENT jika judul, tipe file, atau ukuran tidak valid.
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse);
  // CompleteUpload dipanggil setelah browser selesai mengunggah. Service
  // memeriksa file di storage, lalu mengubah status menjadi UPLOADED.
  // Error NOT_FOUND jika video tidak ada atau bukan milik requester,
  // FAILED_PRECONDITION jika file belum ada atau ukurannya tidak sesuai.
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  // GetVideo mengambil satu video. Video READY bisa dilihat siapa saja dan
  // diputar lewat video.hls_url. Video yang belum READY (belum selesai
  // diunggah, sedang atau gagal di-transcode) hanya bisa dilihat pemiliknya.
  rpc GetVideo(GetVideoRequest) returns (GetVideoResponse);
  // ListMyVideos mengambil video milik requester, terbaru lebih dulu.
  rpc ListMyVideos(ListMyVideosRequest) returns (ListMyVideosResponse);
  // ListVideos mengambil feed publik: hanya video READY, yang paling baru
  // selesai diproses lebih dulu. Boleh dipanggil tanpa login. Isi owner_id
  // untuk daftar video satu channel.
  // Error INVALID_ARGUMENT jika page_size atau page_token tidak valid.
  rpc ListVideos(ListVideosRequest) returns (ListVideosResponse);
  // RecordView menambah views video READY, maksimal sekali per penonton
  // dalam satu window (default 30 menit). Error NOT_FOUND jika video tidak
  // ada atau belum READY, UNAVAILABLE jika pencatatan views sedang mati.
  rpc RecordView(RecordViewRequest) returns (RecordViewResponse);
  // LikeVideo menandai video READY disukai requester. Aman dipanggil ulang:
  // like kedua tidak menambah like_count. Error NOT_FOUND jika video tidak
  // ada atau belum READY.
  rpc LikeVideo(LikeVideoRequest) returns (LikeVideoResponse);
  // UnlikeVideo membatalkan like. Aman dipanggil walau belum pernah like.
  rpc UnlikeVideo(UnlikeVideoRequest) returns (UnlikeVideoResponse);
  // SearchVideos mencari video READY yang judul atau deskripsinya berisi
  // SEMUA kata di query. Setiap kata cocok dengan awal kata, jadi "gol"
  // menemukan "Golang". Urutan: paling relevan (kata di judul lebih
  // penting), lalu views terbanyak. Boleh dipanggil tanpa login.
  // Error INVALID_ARGUMENT jika query kosong, terlalu panjang, atau tidak
  // berisi kata dengan 2 huruf atau lebih.
  rpc SearchVideos(SearchVideosRequest) returns (SearchVideosResponse);
  // SaveWatchProgress menyimpan sampai detik berapa requester menonton
  // video READY, untuk riwayat tonton dan "lanjut menonton". Dipanggil
  // player setiap beberapa detik. Aman dipanggil ulang: video yang sama
  // hanya punya satu entri riwayat. Error INVALID_ARGUMENT jika
  // position_ms negatif, NOT_FOUND jika video tidak ada atau belum READY.
  rpc SaveWatchProgress(SaveWatchProgressRequest) returns (SaveWatchProgressResponse);
  // ListWatchHistory mengambil riwayat tonton requester, yang terakhir
  // ditonton lebih dulu. Hanya video READY.
  rpc ListWatchHistory(ListWatchHistoryRequest) returns (ListWatchHistoryResponse);
  // DeleteWatchHistory menghapus satu video dari riwayat requester. Aman
  // dipanggil walau video itu tidak ada di riwayat.
  rpc DeleteWatchHistory(DeleteWatchHistoryRequest) returns (DeleteWatchHistoryResponse);
  // ClearWatchHistory menghapus seluruh riwayat tonton requester.
  rpc ClearWatchHistory(ClearWatchHistoryRequest) returns (ClearWatchHistoryResponse);
  // UpdateVideo mengganti judul dan/atau deskripsi video milik requester
  // (status apa pun). Kata pencarian ikut diperbarui. Error
  // INVALID_ARGUMENT jika tidak ada field yang dikirim atau isinya tidak
  // valid, NOT_FOUND jika video tidak ada, sudah dihapus, atau bukan milik
  // requester.
  rpc UpdateVideo(UpdateVideoRequest) returns (UpdateVideoResponse);
  // DeleteVideo menghapus video milik requester dari feed, pencarian,
  // channel, riwayat, komentar, dan danmaku, lalu menghapus file-nya di
  // storage. Error NOT_FOUND jika video tidak ada, sudah dihapus, atau
  // bukan milik requester; FAILED_PRECONDITION jika video sedang
  // di-transcode (UPLOADED atau PROCESSING).
  rpc DeleteVideo(DeleteVideoRequest) returns (DeleteVideoResponse);
}

enum VideoStatus {
  VIDEO_STATUS_UNSPECIFIED = 0;
  // Baris sudah dibuat, file belum (selesai) diunggah.
  VIDEO_STATUS_PENDING_UPLOAD = 1;
  // File sudah ada di storage dan ukurannya sudah dicek. Menunggu transcoder.
  VIDEO_STATUS_UPLOADED = 2;
  // Transcoder sedang membuat file HLS dan thumbnail.
  VIDEO_STATUS_PROCESSING = 3;
  // File HLS siap diputar. Hanya video READY yang terlihat oleh semua orang.
  VIDEO_STATUS_READY = 4;
  // Transcoding gagal, alasannya ada di failure_reason.
  VIDEO_STATUS_FAILED = 5;
}

message Video {
  int64 id = 1;
  int64 owner_id = 2;
  string title = 3;
  string description = 4;
  VideoStatus status = 5;
  string content_type = 6;
  int64 size_bytes = 7;
  google.protobuf.Timestamp created_at = 8;
  // Kosong selama status masih PENDING_UPLOAD.
  google.protobuf.Timestamp uploaded_at = 9;
  // Durasi video dalam milidetik. 0 sampai status READY.
  int64 duration_ms = 10;
  // Resolusi HLS yang tersedia, misalnya ["360p", "720p"]. Kosong sampai READY.
  repeated string renditions = 11;
  // Alasan gagal. Hanya terisi jika status FAILED.
  string failure_reason = 12;
  // Waktu transcoding selesai (READY atau FAILED).
  google.protobuf.Timestamp processed_at = 13;
  // URL publik daftar putar HLS (master.m3u8), untuk player seperti hls.js.
  // Tidak kedaluwarsa. Hanya terisi jika status READY.
  string hls_url = 14;
  // URL publik gambar thumbnail (JPEG, tinggi 360 piksel). Hanya terisi jika
  // status READY.
  string thumbnail_url = 15;
  // Jumlah views (lihat RecordView).
  int64 view_count = 16;
  // Jumlah komentar dan balasan yang belum dihapus (langkah 9).
  int64 comment_count = 17;
  // Jumlah like (langkah 10).
  int64 like_count = 18;
}

message CreateUploadRequest {
  int64 requester_id = 1;
  string title = 2;
  string description = 3;
  // Misalnya "video/mp4". Harus sama persis dengan header Content-Type
  // yang dikirim browser saat mengunggah.
  string content_type = 4;
  int64 size_bytes = 5;
}

message CreateUploadResponse {
  Video video = 1;
  // URL tujuan PUT. Hanya berlaku sampai upload_url_expires_at.
  string upload_url = 2;
  google.protobuf.Timestamp upload_url_expires_at = 3;
  // Header yang WAJIB ikut dikirim bersama PUT (termasuk Content-Type),
  // karena ikut ditandatangani di dalam URL.
  map<string, string> upload_headers = 4;
}

message CompleteUploadRequest {
  int64 requester_id = 1;
  int64 video_id = 2;
}

message CompleteUploadResponse {
  Video video = 1;
}

message GetVideoRequest {
  int64 video_id = 1;
  // 0 berarti pengunjung belum login.
  int64 viewer_id = 2;
}

message GetVideoResponse {
  Video video = 1;
  // URL presigned untuk mengunduh file asli (sebelum di-transcode). Hanya
  // untuk pemilik video, dan kosong selama PENDING_UPLOAD. Untuk memutar
  // video, pakai video.hls_url.
  string original_url = 2;
  google.protobuf.Timestamp original_url_expires_at = 3;
  // true jika viewer_id sudah like video ini. Selalu false tanpa login.
  bool viewer_liked = 4;
  // Detik (milidetik) tempat viewer berhenti menonton terakhir kali, untuk
  // "lanjut menonton". 0 = putar dari awal: belum pernah ditonton, baru
  // ditonton kurang dari 5 detik, atau sisa videonya kurang dari 10 detik.
  // Selalu 0 tanpa login.
  int64 resume_position_ms = 5;
}

message ListMyVideosRequest {
  int64 requester_id = 1;
  // Jumlah maksimal per halaman (1 sampai 50, default 20).
  int32 page_size = 2;
  // Kosong untuk halaman pertama, lalu isi dengan next_page_token.
  string page_token = 3;
}

message ListMyVideosResponse {
  repeated Video videos = 1;
  // Kosong jika sudah halaman terakhir.
  string next_page_token = 2;
}

message ListVideosRequest {
  // Jumlah maksimal per halaman (1 sampai 50, default 20).
  int32 page_size = 1;
  // Kosong untuk halaman pertama, lalu isi dengan next_page_token.
  // Isinya tidak perlu dipahami client.
  string page_token = 2;
  // Jika diisi, hanya video milik user ini (halaman channel). 0 = semua.
  int64 owner_id = 3;
  // Jika diisi, hanya video milik salah satu user ini (feed subscription).
  // Maksimal 1000 id. Boleh digabung dengan owner_id.
  repeated int64 owner_ids = 4;
}

message ListVideosResponse {
  repeated Video videos = 1;
  // Kosong jika sudah halaman terakhir.
  string next_page_token = 2;
}

message SearchVideosRequest {
  // Kata kunci dari kotak pencarian, maksimal 100 karakter. Hanya 5 kata
  // pertama yang dipakai.
  string query = 1;
  // Jumlah maksimal per halaman (1 sampai 50, default 20).
  int32 page_size = 2;
  // Kosong untuk halaman pertama, lalu isi dengan next_page_token.
  string page_token = 3;
}

message SearchVideosResponse {
  repeated Video videos = 1;
  // Kosong jika sudah halaman terakhir. Pencarian dibatasi 10 halaman.
  string next_page_token = 2;
}

message RecordViewRequest {
  int64 video_id = 1;
  // Penanda penonton dari gateway, misalnya "u-7" (user login) atau
  // "a-<hash>" (tanpa login). 1 sampai 64 karakter: huruf, angka, - dan _.
  string viewer_key = 2;
}

message RecordViewResponse {
  // false jika penonton ini sudah dihitung dalam window yang sama.
  bool counted = 1;
  // Jumlah views setelah request ini.
  int64 view_count = 2;
}

message LikeVideoRequest {
  int64 requester_id = 1;
  int64 video_id = 2;
}

message LikeVideoResponse {
  // Selalu true.
  bool liked = 1;
  int64 like_count = 2;
}

message UnlikeVideoRequest {
  int64 requester_id = 1;
  int64 video_id = 2;
}

message UnlikeVideoResponse {
  // Selalu false.
  bool liked = 1;
  int64 like_count = 2;
}

message SaveWatchProgressRequest {
  int64 requester_id = 1;
  int64 video_id = 2;
  // Posisi player, milidetik dari awal video. Nilai yang melewati durasi
  // video dipotong menjadi durasi.
  int64 position_ms = 3;
}

message SaveWatchProgressResponse {
  // Posisi yang benar-benar disimpan.
  int64 position_ms = 1;
  google.protobuf.Timestamp watched_at = 2;
}

// WatchHistoryEntry adalah satu video di riwayat tonton.
message WatchHistoryEntry {
  Video video = 1;
  // Detik terakhir yang ditonton (milidetik). Untuk garis progres:
  // position_ms / video.duration_ms.
  int64 position_ms = 2;
  // Waktu terakhir video ini ditonton.
  google.protobuf.Timestamp watched_at = 3;
}

message ListWatchHistoryRequest {
  int64 requester_id = 1;
  // Jumlah maksimal per halaman (1 sampai 50, default 20).
  int32 page_size = 2;
  // Kosong untuk halaman pertama, lalu isi dengan next_page_token.
  string page_token = 3;
}

message ListWatchHistoryResponse {
  repeated WatchHistoryEntry entries = 1;
  // Kosong jika sudah halaman terakhir.
  string next_page_token = 2;
}

message DeleteWatchHistoryRequest {
  int64 requester_id = 1;
  int64 video_id = 2;
}

message DeleteWatchHistoryResponse {}

message ClearWatchHistoryRequest {
  int64 requester_id = 1;
}

message ClearWatchHistoryResponse {
  // Jumlah video yang dihapus dari riwayat.
  int64 deleted = 1;
}

message UpdateVideoRequest {
  int64 requester_id = 1;
  int64 video_id = 2;
  // Tidak dikirim = tidak diubah. Memakai "optional" supaya deskripsi
  // kosong ("" = hapus deskripsi) bisa dibedakan dari "tidak dikirim".
  // Aturannya sama dengan CreateUpload: judul wajib, maksimal 100 karakter.
  optional string title = 3;
  // Maksimal 1000 karakter.
  optional string description = 4;
}

message UpdateVideoResponse {
  Video video = 1;
}

message DeleteVideoRequest {
  int64 requester_id = 1;
  int64 video_id = 2;
}

message DeleteVideoResponse {}
