syntax = "proto3";

// Kontrak gRPC VideoService. Seperti AuthService, hanya dipanggil oleh API
// gateway dari dalam cluster. Gateway yang memeriksa access token, lalu
// mengirim id user yang sudah terverifikasi di field requester_id/viewer_id.
package video.v1;

import "google/protobuf/timestamp.proto";

service VideoService {
  // CreateUpload mencatat video baru (status PENDING_UPLOAD) dan memberi URL
  // presigned untuk mengunggah file langsung dari browser ke object storage.
  // Error INVALID_ARGUMENT jika judul, tipe file, atau ukuran tidak valid.
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse);
  // CompleteUpload dipanggil setelah browser selesai mengunggah. Service
  // memeriksa file di storage, lalu mengubah status menjadi UPLOADED.
  // Error NOT_FOUND jika video tidak ada atau bukan milik requester,
  // FAILED_PRECONDITION jika file belum ada atau ukurannya tidak sesuai.
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  // GetVideo mengambil satu video. Video READY bisa dilihat siapa saja dan
  // diputar lewat video.hls_url. Video yang belum READY (belum selesai
  // diunggah, sedang atau gagal di-transcode) hanya bisa dilihat pemiliknya.
  rpc GetVideo(GetVideoRequest) returns (GetVideoResponse);
  // ListMyVideos mengambil video milik requester, terbaru lebih dulu.
  rpc ListMyVideos(ListMyVideosRequest) returns (ListMyVideosResponse);
  // ListVideos mengambil feed publik: hanya video READY, yang paling baru
  // selesai diproses lebih dulu. Boleh dipanggil tanpa login. Isi owner_id
  // untuk daftar video satu channel.
  // Error INVALID_ARGUMENT jika page_size atau page_token tidak valid.
  rpc ListVideos(ListVideosRequest) returns (ListVideosResponse);
  // RecordView menambah views video READY, maksimal sekali per penonton
  // dalam satu window (default 30 menit). Error NOT_FOUND jika video tidak
  // ada atau belum READY, UNAVAILABLE jika pencatatan views sedang mati.
  rpc RecordView(RecordViewRequest) returns (RecordViewResponse);
  // LikeVideo menandai video READY disukai requester. Aman dipanggil ulang:
  // like kedua tidak menambah like_count. Error NOT_FOUND jika video tidak
  // ada atau belum READY.
  rpc LikeVideo(LikeVideoRequest) returns (LikeVideoResponse);
  // UnlikeVideo membatalkan like. Aman dipanggil walau belum pernah like.
  rpc UnlikeVideo(UnlikeVideoRequest) returns (UnlikeVideoResponse);
  // SearchVideos mencari video READY yang judul atau deskripsinya berisi
  // SEMUA kata di query. Setiap kata cocok dengan awal kata, jadi "gol"
  // menemukan "Golang". Urutan: paling relevan (kata di judul lebih
  // penting), lalu views terbanyak. Boleh dipanggil tanpa login.
  // Error INVALID_ARGUMENT jika query kosong, terlalu panjang, atau tidak
  // berisi kata dengan 2 huruf atau lebih.
  rpc SearchVideos(SearchVideosRequest) returns (SearchVideosResponse);
  // SaveWatchProgress menyimpan sampai detik berapa requester menonton
  // video READY, untuk riwayat tonton dan "lanjut menonton". Dipanggil
  // player setiap beberapa detik. Aman dipanggil ulang: video yang sama
  // hanya punya satu entri riwayat. Error INVALID_ARGUMENT jika
  // position_ms negatif, NOT_FOUND jika video tidak ada atau belum READY.
  rpc SaveWatchProgress(SaveWatchProgressRequest) returns (SaveWatchProgressResponse);
  // ListWatchHistory mengambil riwayat tonton requester, yang terakhir
  // ditonton lebih dulu. Hanya video READY.
  rpc ListWatchHistory(ListWatchHistoryRequest) returns (ListWatchHistoryResponse);
  // DeleteWatchHistory menghapus satu video dari riwayat requester. Aman
  // dipanggil walau video itu tidak ada di riwayat.
  rpc DeleteWatchHistory(DeleteWatchHistoryRequest) returns (DeleteWatchHistoryResponse);
  // ClearWatchHistory menghapus seluruh riwayat tonton requester.
  rpc ClearWatchHistory(ClearWatchHistoryRequest) returns (ClearWatchHistoryResponse);
  // UpdateVideo mengganti judul dan/atau deskripsi video milik requester
  // (status apa pun). Kata pencarian ikut diperbarui. Error
  // INVALID_ARGUMENT jika tidak ada field yang dikirim atau isinya tidak
  // valid, NOT_FOUND jika video tidak ada, sudah dihapus, atau bukan milik
  // requester.
  rpc UpdateVideo(UpdateVideoRequest) returns (UpdateVideoResponse);
  // DeleteVideo menghapus video milik requester dari feed, pencarian,
  // channel, riwayat, komentar, dan danmaku, lalu menghapus file-nya di
  // storage. Error NOT_FOUND jika video tidak ada, sudah dihapus, atau
  // bukan milik requester; FAILED_PRECONDITION jika video sedang
  // di-transcode (UPLOADED atau PROCESSING).
  rpc DeleteVideo(DeleteVideoRequest) returns (DeleteVideoResponse);
  // ListNotifications mengambil notifikasi requester, terbaru lebih dulu.
  // Notifikasi untuk video yang sudah dihapus tidak ikut.
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  // CountUnreadNotifications menghitung notifikasi requester yang belum
  // dibaca, maksimal 100 (untuk badge "99+").
  rpc CountUnreadNotifications(CountUnreadNotificationsRequest) returns (CountUnreadNotificationsResponse);
  // MarkNotificationsRead menandai satu notifikasi, atau semuanya, sebagai
  // sudah dibaca. Aman dipanggil berulang.
  rpc MarkNotificationsRead(MarkNotificationsReadRequest) returns (MarkNotificationsReadResponse);
  // AddToWatchLater menyimpan video READY ke daftar Tonton nanti requester.
  // Aman dipanggil ulang: video yang sudah tersimpan tidak berubah
  // (added_at tetap waktu pertama disimpan). NOT_FOUND jika video tidak ada
  // atau belum READY.
  rpc AddToWatchLater(AddToWatchLaterRequest) returns (AddToWatchLaterResponse);
  // RemoveFromWatchLater mengeluarkan video dari daftar Tonton nanti. Aman
  // dipanggil walau video itu tidak ada di daftar.
  rpc RemoveFromWatchLater(RemoveFromWatchLaterRequest) returns (RemoveFromWatchLaterResponse);
  // ListWatchLater mengambil daftar Tonton nanti requester, yang terakhir
  // disimpan lebih dulu. Hanya video READY.
  rpc ListWatchLater(ListWatchLaterRequest) returns (ListWatchLaterResponse);

  // Playlist (langkah 21c). Playlist PRIVATE hanya terlihat oleh pemiliknya:
  // bagi orang lain jawabannya NOT_FOUND, sama seperti playlist yang tidak
  // ada. Mengubah playlist orang lain juga dijawab NOT_FOUND.

  // CreatePlaylist membuat playlist kosong milik requester.
  // INVALID_ARGUMENT jika judul/deskripsi/visibilitas tidak valid atau
  // requester sudah mencapai batas jumlah playlist.
  rpc CreatePlaylist(CreatePlaylistRequest) returns (CreatePlaylistResponse);
  // UpdatePlaylist mengubah judul, deskripsi, dan/atau visibilitas.
  rpc UpdatePlaylist(UpdatePlaylistRequest) returns (UpdatePlaylistResponse);
  // DeletePlaylist menghapus playlist beserta isinya (videonya tidak).
  rpc DeletePlaylist(DeletePlaylistRequest) returns (DeletePlaylistResponse);
  // GetPlaylist mengambil satu playlist, termasuk jumlah video dan thumbnail.
  rpc GetPlaylist(GetPlaylistRequest) returns (GetPlaylistResponse);
  // ListPlaylists mengambil playlist milik owner_id, terbaru lebih dulu.
  // PRIVATE hanya ikut jika viewer_id = owner_id.
  rpc ListPlaylists(ListPlaylistsRequest) returns (ListPlaylistsResponse);
  // AddToPlaylist menambahkan video READY ke akhir playlist. Aman dipanggil
  // ulang: video yang sudah ada tidak berpindah posisi.
  rpc AddToPlaylist(AddToPlaylistRequest) returns (AddToPlaylistResponse);
  // RemoveFromPlaylist mengeluarkan video dari playlist. Aman dipanggil
  // walau video itu tidak ada di playlist.
  rpc RemoveFromPlaylist(RemoveFromPlaylistRequest) returns (RemoveFromPlaylistResponse);
  // ListPlaylistVideos mengambil isi playlist sesuai urutan ditambahkan.
  // Hanya video READY.
  rpc ListPlaylistVideos(ListPlaylistVideosRequest) returns (ListPlaylistVideosResponse);

  // GetChannelStats mengambil statistik channel milik requester untuk
  // dasbor Creator Studio (langkah 22b): tayangan per hari, jumlah danmaku
  // dan komentar yang diterima, untuk periode ini dan periode sebelumnya
  // yang panjangnya sama. Hari dihitung dalam WIB (UTC+7).
  // INVALID_ARGUMENT jika days bukan 7, 28, atau 90.
  rpc GetChannelStats(GetChannelStatsRequest) returns (GetChannelStatsResponse);

  // SearchPlaylists mencari playlist PUBLIC yang judulnya berisi setiap
  // kata di query (langkah 22c, tab Playlist di halaman pencarian).
  // Playlist tanpa video READY tidak ikut. Urutan: judul yang diawali kata
  // pertama lebih dulu, lalu yang paling baru diperbarui.
  rpc SearchPlaylists(SearchPlaylistsRequest) returns (SearchPlaylistsResponse);
}

enum VideoStatus {
  VIDEO_STATUS_UNSPECIFIED = 0;
  // Baris sudah dibuat, file belum (selesai) diunggah.
  VIDEO_STATUS_PENDING_UPLOAD = 1;
  // File sudah ada di storage dan ukurannya sudah dicek. Menunggu transcoder.
  VIDEO_STATUS_UPLOADED = 2;
  // Transcoder sedang membuat file HLS dan thumbnail.
  VIDEO_STATUS_PROCESSING = 3;
  // File HLS siap diputar. Hanya video READY yang terlihat oleh semua orang.
  VIDEO_STATUS_READY = 4;
  // Transcoding gagal, alasannya ada di failure_reason.
  VIDEO_STATUS_FAILED = 5;
}

message Video {
  int64 id = 1;
  int64 owner_id = 2;
  string title = 3;
  string description = 4;
  VideoStatus status = 5;
  string content_type = 6;
  int64 size_bytes = 7;
  google.protobuf.Timestamp created_at = 8;
  // Kosong selama status masih PENDING_UPLOAD.
  google.protobuf.Timestamp uploaded_at = 9;
  // Durasi video dalam milidetik. 0 sampai status READY.
  int64 duration_ms = 10;
  // Resolusi HLS yang tersedia, misalnya ["360p", "720p"]. Kosong sampai READY.
  repeated string renditions = 11;
  // Alasan gagal. Hanya terisi jika status FAILED.
  string failure_reason = 12;
  // Waktu transcoding selesai (READY atau FAILED).
  google.protobuf.Timestamp processed_at = 13;
  // URL publik daftar putar HLS (master.m3u8), untuk player seperti hls.js.
  // Tidak kedaluwarsa. Hanya terisi jika status READY.
  string hls_url = 14;
  // URL publik gambar thumbnail (JPEG, tinggi 360 piksel). Hanya terisi jika
  // status READY.
  string thumbnail_url = 15;
  // Jumlah views (lihat RecordView).
  int64 view_count = 16;
  // Jumlah komentar dan balasan yang belum dihapus (langkah 9).
  int64 comment_count = 17;
  // Jumlah like (langkah 10).
  int64 like_count = 18;
}

message CreateUploadRequest {
  int64 requester_id = 1;
  string title = 2;
  string description = 3;
  // Misalnya "video/mp4". Harus sama persis dengan header Content-Type
  // yang dikirim browser saat mengunggah.
  string content_type = 4;
  int64 size_bytes = 5;
}

message CreateUploadResponse {
  Video video = 1;
  // URL tujuan PUT. Hanya berlaku sampai upload_url_expires_at.
  string upload_url = 2;
  google.protobuf.Timestamp upload_url_expires_at = 3;
  // Header yang WAJIB ikut dikirim bersama PUT (termasuk Content-Type),
  // karena ikut ditandatangani di dalam URL.
  map<string, string> upload_headers = 4;
}

message CompleteUploadRequest {
  int64 requester_id = 1;
  int64 video_id = 2;
}

message CompleteUploadResponse {
  Video video = 1;
}

message GetVideoRequest {
  int64 video_id = 1;
  // 0 berarti pengunjung belum login.
  int64 viewer_id = 2;
}

message GetVideoResponse {
  Video video = 1;
  // URL presigned untuk mengunduh file asli (sebelum di-transcode). Hanya
  // untuk pemilik video, dan kosong selama PENDING_UPLOAD. Untuk memutar
  // video, pakai video.hls_url.
  string original_url = 2;
  google.protobuf.Timestamp original_url_expires_at = 3;
  // true jika viewer_id sudah like video ini. Selalu false tanpa login.
  bool viewer_liked = 4;
  // Detik (milidetik) tempat viewer berhenti menonton terakhir kali, untuk
  // "lanjut menonton". 0 = putar dari awal: belum pernah ditonton, baru
  // ditonton kurang dari 5 detik, atau sisa videonya kurang dari 10 detik.
  // Selalu 0 tanpa login.
  int64 resume_position_ms = 5;
  // true jika viewer_id sudah menyimpan video ini ke Tonton nanti. Selalu
  // false tanpa login.
  bool viewer_saved = 6;
  // true jika video ini ada di salah satu playlist milik viewer_id. Selalu
  // false tanpa login.
  bool viewer_in_playlist = 7;
}

message ListMyVideosRequest {
  int64 requester_id = 1;
  // Jumlah maksimal per halaman (1 sampai 50, default 20).
  int32 page_size = 2;
  // Kosong untuk halaman pertama, lalu isi dengan next_page_token.
  string page_token = 3;
}

message ListMyVideosResponse {
  repeated Video videos = 1;
  // Kosong jika sudah halaman terakhir.
  string next_page_token = 2;
}

message ListVideosRequest {
  // Jumlah maksimal per halaman (1 sampai 50, default 20).
  int32 page_size = 1;
  // Kosong untuk halaman pertama, lalu isi dengan next_page_token.
  // Isinya tidak perlu dipahami client.
  string page_token = 2;
  // Jika diisi, hanya video milik user ini (halaman channel). 0 = semua.
  int64 owner_id = 3;
  // Jika diisi, hanya video milik salah satu user ini (feed subscription).
  // Maksimal 1000 id. Boleh digabung dengan owner_id.
  repeated int64 owner_ids = 4;
}

message ListVideosResponse {
  repeated Video videos = 1;
  // Kosong jika sudah halaman terakhir.
  string next_page_token = 2;
}

message SearchVideosRequest {
  // Kata kunci dari kotak pencarian, maksimal 100 karakter. Hanya 5 kata
  // pertama yang dipakai.
  string query = 1;
  // Jumlah maksimal per halaman (1 sampai 50, default 20).
  int32 page_size = 2;
  // Kosong untuk halaman pertama, lalu isi dengan next_page_token.
  string page_token = 3;
}

message SearchVideosResponse {
  repeated Video videos = 1;
  // Kosong jika sudah halaman terakhir. Pencarian dibatasi 10 halaman.
  string next_page_token = 2;
}

message RecordViewRequest {
  int64 video_id = 1;
  // Penanda penonton dari gateway, misalnya "u-7" (user login) atau
  // "a-<hash>" (tanpa login). 1 sampai 64 karakter: huruf, angka, - dan _.
  string viewer_key = 2;
}

message RecordViewResponse {
  // false jika penonton ini sudah dihitung dalam window yang sama.
  bool counted = 1;
  // Jumlah views setelah request ini.
  int64 view_count = 2;
}

message LikeVideoRequest {
  int64 requester_id = 1;
  int64 video_id = 2;
}

message LikeVideoResponse {
  // Selalu true.
  bool liked = 1;
  int64 like_count = 2;
}

message UnlikeVideoRequest {
  int64 requester_id = 1;
  int64 video_id = 2;
}

message UnlikeVideoResponse {
  // Selalu false.
  bool liked = 1;
  int64 like_count = 2;
}

message SaveWatchProgressRequest {
  int64 requester_id = 1;
  int64 video_id = 2;
  // Posisi player, milidetik dari awal video. Nilai yang melewati durasi
  // video dipotong menjadi durasi.
  int64 position_ms = 3;
}

message SaveWatchProgressResponse {
  // Posisi yang benar-benar disimpan.
  int64 position_ms = 1;
  google.protobuf.Timestamp watched_at = 2;
}

// WatchHistoryEntry adalah satu video di riwayat tonton.
message WatchHistoryEntry {
  Video video = 1;
  // Detik terakhir yang ditonton (milidetik). Untuk garis progres:
  // position_ms / video.duration_ms.
  int64 position_ms = 2;
  // Waktu terakhir video ini ditonton.
  google.protobuf.Timestamp watched_at = 3;
}

message ListWatchHistoryRequest {
  int64 requester_id = 1;
  // Jumlah maksimal per halaman (1 sampai 50, default 20).
  int32 page_size = 2;
  // Kosong untuk halaman pertama, lalu isi dengan next_page_token.
  string page_token = 3;
}

message ListWatchHistoryResponse {
  repeated WatchHistoryEntry entries = 1;
  // Kosong jika sudah halaman terakhir.
  string next_page_token = 2;
}

message DeleteWatchHistoryRequest {
  int64 requester_id = 1;
  int64 video_id = 2;
}

message DeleteWatchHistoryResponse {}

message ClearWatchHistoryRequest {
  int64 requester_id = 1;
}

message ClearWatchHistoryResponse {
  // Jumlah video yang dihapus dari riwayat.
  int64 deleted = 1;
}

message UpdateVideoRequest {
  int64 requester_id = 1;
  int64 video_id = 2;
  // Tidak dikirim = tidak diubah. Memakai "optional" supaya deskripsi
  // kosong ("" = hapus deskripsi) bisa dibedakan dari "tidak dikirim".
  // Aturannya sama dengan CreateUpload: judul wajib, maksimal 100 karakter.
  optional string title = 3;
  // Maksimal 1000 karakter.
  optional string description = 4;
}

message UpdateVideoResponse {
  Video video = 1;
}

message DeleteVideoRequest {
  int64 requester_id = 1;
  int64 video_id = 2;
}

message DeleteVideoResponse {}

message Notification {
  int64 id = 1;
  // Jenis notifikasi. Untuk sekarang selalu "NEW_VIDEO": channel yang
  // di-subscribe merilis video baru.
  string kind = 2;
  // Video yang dibicarakan. Pemiliknya (owner_id) adalah channel-nya.
  Video video = 3;
  google.protobuf.Timestamp created_at = 4;
  // Kosong jika belum dibaca.
  google.protobuf.Timestamp read_at = 5;
}

message ListNotificationsRequest {
  int64 requester_id = 1;
  // 1 sampai 50. 0 = 20.
  int32 page_size = 2;
  string page_token = 3;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  string next_page_token = 2;
}

message CountUnreadNotificationsRequest {
  int64 requester_id = 1;
}

message CountUnreadNotificationsResponse {
  // 0 sampai 100. Nilai 100 berarti "100 atau lebih".
  int64 unread_count = 1;
}

message MarkNotificationsReadRequest {
  int64 requester_id = 1;
  // 0 = tandai SEMUA notifikasi requester.
  int64 notification_id = 2;
}

message MarkNotificationsReadResponse {
  // Jumlah notifikasi yang baru ditandai dibaca (0 jika sudah dibaca
  // sebelumnya atau bukan milik requester).
  int64 updated = 1;
  // Sisa yang belum dibaca, sama seperti CountUnreadNotifications.
  int64 unread_count = 2;
}

message WatchLaterEntry {
  Video video = 1;
  // Waktu video ini disimpan ke Tonton nanti.
  google.protobuf.Timestamp added_at = 2;
}

message AddToWatchLaterRequest {
  int64 requester_id = 1;
  int64 video_id = 2;
}

message AddToWatchLaterResponse {
  // Waktu video pertama kali disimpan (tidak berubah jika disimpan ulang).
  google.protobuf.Timestamp added_at = 1;
}

message RemoveFromWatchLaterRequest {
  int64 requester_id = 1;
  int64 video_id = 2;
}

message RemoveFromWatchLaterResponse {}

message ListWatchLaterRequest {
  int64 requester_id = 1;
  // Jumlah maksimal per halaman (1 sampai 50, default 20).
  int32 page_size = 2;
  // Kosong untuk halaman pertama, lalu isi dengan next_page_token.
  string page_token = 3;
}

message ListWatchLaterResponse {
  repeated WatchLaterEntry entries = 1;
  // Kosong jika sudah halaman terakhir.
  string next_page_token = 2;
}

// ---------- Playlist (langkah 21c) ----------

enum PlaylistVisibility {
  PLAYLIST_VISIBILITY_UNSPECIFIED = 0;
  // Terlihat di halaman kanal dan bisa dibuka siapa saja.
  PLAYLIST_VISIBILITY_PUBLIC = 1;
  // Hanya pemiliknya yang bisa melihat.
  PLAYLIST_VISIBILITY_PRIVATE = 2;
}

message Playlist {
  int64 id = 1;
  int64 owner_id = 2;
  string title = 3;
  string description = 4;
  PlaylistVisibility visibility = 5;
  // Jumlah video READY di playlist.
  int64 video_count = 6;
  // Thumbnail video pertama. Kosong jika playlist belum berisi video READY.
  string thumbnail_url = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Hanya diisi ListPlaylists yang memakai video_id: true jika video itu
  // ada di playlist ini.
  bool contains_video = 10;
}

message PlaylistEntry {
  Video video = 1;
  // Waktu video ditambahkan ke playlist.
  google.protobuf.Timestamp added_at = 2;
}

message CreatePlaylistRequest {
  int64 requester_id = 1;
  // Wajib, maksimal 100 karakter.
  string title = 2;
  // Boleh kosong, maksimal 1000 karakter.
  string description = 3;
  // UNSPECIFIED = PRIVATE.
  PlaylistVisibility visibility = 4;
}

message CreatePlaylistResponse {
  Playlist playlist = 1;
}

message UpdatePlaylistRequest {
  int64 requester_id = 1;
  int64 playlist_id = 2;
  // Tidak dikirim = tidak diubah (sama seperti UpdateVideoRequest).
  optional string title = 3;
  optional string description = 4;
  // UNSPECIFIED = tidak diubah.
  PlaylistVisibility visibility = 5;
}

message UpdatePlaylistResponse {
  Playlist playlist = 1;
}

message DeletePlaylistRequest {
  int64 requester_id = 1;
  int64 playlist_id = 2;
}

message DeletePlaylistResponse {}

message GetPlaylistRequest {
  // 0 = pengunjung belum login.
  int64 viewer_id = 1;
  int64 playlist_id = 2;
}

message GetPlaylistResponse {
  Playlist playlist = 1;
}

message ListPlaylistsRequest {
  // 0 = pengunjung belum login.
  int64 viewer_id = 1;
  int64 owner_id = 2;
  // Opsional, hanya untuk playlist milik viewer sendiri: isi id video untuk
  // mengisi Playlist.contains_video (dialog Simpan di halaman tonton).
  int64 video_id = 3;
  // Jumlah maksimal per halaman (1 sampai 50, default 20).
  int32 page_size = 4;
  // Kosong untuk halaman pertama, lalu isi dengan next_page_token.
  string page_token = 5;
}

message ListPlaylistsResponse {
  repeated Playlist playlists = 1;
  // Kosong jika sudah halaman terakhir.
  string next_page_token = 2;
}

message AddToPlaylistRequest {
  int64 requester_id = 1;
  int64 playlist_id = 2;
  int64 video_id = 3;
}

message AddToPlaylistResponse {
  // Waktu video pertama kali ditambahkan (tidak berubah jika ditambah ulang).
  google.protobuf.Timestamp added_at = 1;
}

message RemoveFromPlaylistRequest {
  int64 requester_id = 1;
  int64 playlist_id = 2;
  int64 video_id = 3;
}

message RemoveFromPlaylistResponse {}

message ListPlaylistVideosRequest {
  // 0 = pengunjung belum login.
  int64 viewer_id = 1;
  int64 playlist_id = 2;
  // Jumlah maksimal per halaman (1 sampai 50, default 20).
  int32 page_size = 3;
  // Kosong untuk halaman pertama, lalu isi dengan next_page_token.
  string page_token = 4;
}

message ListPlaylistVideosResponse {
  repeated PlaylistEntry entries = 1;
  // Kosong jika sudah halaman terakhir.
  string next_page_token = 2;
}

message GetChannelStatsRequest {
  int64 requester_id = 1;
  // Panjang periode dalam hari: 7, 28, atau 90.
  int32 days = 2;
}

// DailyViews adalah jumlah tayangan semua video channel pada satu hari.
message DailyViews {
  // Tanggal dalam WIB, format "2006-01-02".
  string date = 1;
  int64 views = 2;
}

// ChannelTotals adalah jumlah dalam satu periode.
message ChannelTotals {
  int64 views = 1;
  int64 danmaku = 2;
  int64 comments = 3;
}

message GetChannelStatsResponse {
  // Tepat sebanyak days, urut dari yang terlama sampai hari ini. Hari tanpa
  // tayangan tetap ada dengan views = 0.
  repeated DailyViews daily = 1;
  ChannelTotals current = 2;
  ChannelTotals previous = 3;
  // Batas periode, supaya gateway bisa menanyakan jumlah subscriber baru
  // ke UserService dengan rentang waktu yang sama persis:
  // periode ini = [current_start, end), sebelumnya = [previous_start, current_start).
  google.protobuf.Timestamp previous_start = 4;
  google.protobuf.Timestamp current_start = 5;
  google.protobuf.Timestamp end = 6;
}

message SearchPlaylistsRequest {
  // Sama dengan SearchVideosRequest: maksimal 100 karakter, 5 kata pertama.
  string query = 1;
  // Jumlah maksimal per halaman (1 sampai 50, default 20).
  int32 page_size = 2;
  // Kosong untuk halaman pertama, lalu isi dengan next_page_token.
  string page_token = 3;
}

message SearchPlaylistsResponse {
  repeated Playlist playlists = 1;
  // Kosong jika sudah halaman terakhir (maksimal 10 halaman).
  string next_page_token = 2;
}
