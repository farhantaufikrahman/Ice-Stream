syntax = "proto3";
package auth.v1;

import "google/protobuf/timestamp.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // RequestPasswordReset mengirim tautan reset ke email itu jika terdaftar
  // dan aktif (langkah 24c). Jawabannya selalu sukses, termasuk untuk email
  // yang tidak terdaftar, supaya tidak bisa dipakai menebak email mana yang
  // punya akun. INVALID_ARGUMENT hanya jika formatnya bukan email.
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  // ResetPassword mengganti password memakai token dari email, lalu mencabut
  // semua refresh token user itu (semua perangkat harus login lagi).
  // FAILED_PRECONDITION jika token tidak valid, kedaluwarsa, atau sudah
  // dipakai; INVALID_ARGUMENT jika password baru tidak memenuhi aturan.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  // LoginWithIdentity dipanggil gateway setelah login Google/GitHub
  // berhasil (langkah 26). Mencari atau membuat user, lalu mengembalikan
  // kode login sekali pakai (berlaku 2 menit). INVALID_ARGUMENT jika
  // provider/subject tidak valid; FAILED_PRECONDITION jika penyedia tidak
  // memberi email terverifikasi, email sudah dipakai akun yang belum
  // terverifikasi, atau akun sudah terhubung ke akun lain di penyedia itu;
  // PERMISSION_DENIED jika akun diblokir.
  rpc LoginWithIdentity(LoginWithIdentityRequest) returns (LoginWithIdentityResponse);
  // ExchangeLoginCode menukar kode dari LoginWithIdentity dengan token,
  // sama seperti Login. UNAUTHENTICATED jika kode tidak valid,
  // kedaluwarsa, atau sudah dipakai.
  rpc ExchangeLoginCode(ExchangeLoginCodeRequest) returns (ExchangeLoginCodeResponse);
}

message User {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string display_name = 4;
  string role = 5;
  google.protobuf.Timestamp created_at = 6;
}

message TokenPair {
  string access_token = 1;
  google.protobuf.Timestamp access_token_expires_at = 2;
  string refresh_token = 3;
  google.protobuf.Timestamp refresh_token_expires_at = 4;
}

message ClientInfo {
  string user_agent = 1;
  string ip_address = 2;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string display_name = 4;
}

message RegisterResponse {
  User user = 1;
}

message LoginRequest {
  string login = 1;
  string password = 2;
  ClientInfo client = 3;
}

message LoginResponse {
  User user = 1;
  TokenPair tokens = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
  ClientInfo client = 2;
}

message RefreshTokenResponse {
  TokenPair tokens = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}
message RequestPasswordResetRequest {
  string email = 1;
  // ip_address dicatat bersama token; user_agent tidak dipakai.
  ClientInfo client = 2;
}

message RequestPasswordResetResponse {}

message ResetPasswordRequest {
  // Token dari tautan di email (?token=...).
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {}

message LoginWithIdentityRequest {
  // "google" atau "github".
  string provider = 1;
  // Id user di penyedia ("sub" Google, "id" GitHub).
  string subject = 2;
  string email = 3;
  // true hanya jika penyedia menyatakan email itu sudah diverifikasi.
  bool email_verified = 4;
  // Nama tampilan dari penyedia (boleh kosong).
  string name = 5;
  // Usulan username, misalnya login GitHub (boleh kosong).
  string username_hint = 6;
}

message LoginWithIdentityResponse {
  string login_code = 1;
}

message ExchangeLoginCodeRequest {
  string login_code = 1;
  ClientInfo client = 2;
}

message ExchangeLoginCodeResponse {
  User user = 1;
  TokenPair tokens = 2;
}
