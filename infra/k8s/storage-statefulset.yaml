# Object storage untuk file video: RustFS, server open source (Apache 2.0)
# yang kompatibel dengan API Amazon S3. Kode Go memakai AWS SDK, jadi nanti
# bisa diganti AWS S3 atau Cloudflare R2 cukup dengan mengubah endpoint.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage
  namespace: ice-stream
  labels:
    app.kubernetes.io/name: storage
    app.kubernetes.io/part-of: ice-stream
spec:
  serviceName: storage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage
        app.kubernetes.io/part-of: ice-stream
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        # 10001 = user "rustfs" di image resmi.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Sama seperti Oracle: hostpath Docker Desktop membuat folder volume
        # milik root, jadi pemiliknya diubah dulu ke user rustfs.
        - name: fix-permissions
          image: busybox:1.37
          command: ["sh", "-c", "chown 10001:10001 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            # User admin (root) RustFS, dari Secret storage-credentials.
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: storage-credentials
                  key: STORAGE_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: storage-credentials
                  key: STORAGE_SECRET_KEY
            # Halaman web untuk melihat bucket dan file, di port 9001.
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            # RustFS menulis log ke /logs. Karena root filesystem read-only,
            # folder ini diberi volume sementara (hilang saat pod restart).
            - name: logs
              mountPath: /logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  # PVC data-storage-0 tidak ikut terhapus saat StatefulSet dihapus.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: storage
          app.kubernetes.io/part-of: ice-stream
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
