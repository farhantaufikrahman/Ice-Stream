# Konfigurasi non-rahasia untuk API gateway.
# Rahasia (misalnya API key LiveKit nanti) masuk ke Secret, bukan di sini.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: ice-stream
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: ice-stream
data:
  APP_ENV: production
  HTTP_PORT: "8080"
  # Origin frontend, pisahkan dengan koma: npm run dev (5173) dan frontend
  # di cluster (web/httproute.yaml). Tambahkan domain Vercel kamu nanti.
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://ice-stream.localhost:4000
  SHUTDOWN_TIMEOUT: 10s
  # Gateway tidak lagi terhubung ke Oracle; semua urusan akun lewat AuthService.
  AUTH_GRPC_ADDR: auth:50051
  VIDEO_GRPC_ADDR: video:50052
  # Danmaku live: gateway mendengarkan siaran danmaku baru dari NATS, lalu
  # meneruskannya ke browser (Server-Sent Events).
  NATS_URL: nats://nats:4222
  # Batas penonton danmaku live yang tersambung ke satu pod gateway.
  LIVE_MAX_CLIENTS: "5000"
  # Kunci publik untuk memeriksa access token (dari ConfigMap jwt-public).
  JWT_PUBLIC_KEY_FILE: /etc/ice-stream/jwt/jwt-public.pem
  # Cluster lokal masih http, jadi cookie belum boleh Secure. Ubah ke "true"
  # (dan COOKIE_SAMESITE ke "none" untuk frontend Vercel) setelah memakai HTTPS.
  COOKIE_SECURE: "false"
  COOKIE_SAMESITE: lax
  # Login Google/GitHub (langkah 26). Alamat aplikasi tujuan setelah login,
  # dan alamat gateway yang didaftarkan sebagai callback di Google/GitHub
  # (lihat httproute-oauth.yaml). Client id dan secret ada di Secret
  # oauth-credentials (secrets/oauth.env).
  APP_BASE_URL: http://ice-stream.localhost:4000
  OAUTH_REDIRECT_BASE_URL: http://localhost:4000
