# Port RTMP untuk OBS di PC: rtmp://localhost:1935/live
#
# RTMP bukan HTTP, jadi tidak bisa lewat Gateway (port 4000). Docker
# Desktop membuka Service type LoadBalancer di localhost, sama seperti
# storage-public (localhost:9000).
apiVersion: v1
kind: Service
metadata:
  name: mediamtx-rtmp
  namespace: ice-stream
  labels:
    app.kubernetes.io/name: mediamtx
    app.kubernetes.io/part-of: ice-stream
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: mediamtx
  ports:
    - name: rtmp
      port: 1935
      targetPort: rtmp
