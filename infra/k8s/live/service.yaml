# Alamat MediaMTX di dalam cluster:
#   mediamtx:8888  HLS (diteruskan Gateway, lihat httproute.yaml)
#   mediamtx:8889  WHIP untuk siaran dari browser (httproute-webrtc.yaml)
#   mediamtx:9997  Control API (hanya untuk VideoService, tidak ada HTTPRoute)
#   mediamtx:9996  Playback rekaman (langkah 27, hanya untuk VideoService)
apiVersion: v1
kind: Service
metadata:
  name: mediamtx
  namespace: ice-stream
  labels:
    app.kubernetes.io/name: mediamtx
    app.kubernetes.io/part-of: ice-stream
spec:
  selector:
    app.kubernetes.io/name: mediamtx
  ports:
    - name: hls
      port: 8888
      targetPort: hls
    - name: webrtc
      port: 8889
      targetPort: webrtc
    - name: api
      port: 9997
      targetPort: api
    - name: playback
      port: 9996
      targetPort: playback
