# HLS siaran langsung untuk penonton:
#   http://live.ice-stream.localhost:4000/live/<id user>/index.m3u8
# Alamat ini dikirim VideoService sebagai playback_url (LIVE_PLAYBACK_URL
# di video/configmap.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: live
  namespace: ice-stream
  labels:
    app.kubernetes.io/name: mediamtx
    app.kubernetes.io/part-of: ice-stream
spec:
  parentRefs:
    - name: ice-stream-gateway
  hostnames:
    - live.ice-stream.localhost
  rules:
    # Hanya folder live/ yang diteruskan; alamat lain dijawab 404 oleh
    # Gateway.
    - matches:
        - path:
            type: PathPrefix
            value: /live/
      backendRefs:
        - name: mediamtx
          port: 8888
