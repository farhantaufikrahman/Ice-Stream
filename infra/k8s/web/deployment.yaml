apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ice-stream
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: ice-stream
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: ice-stream
    spec:
      securityContext:
        runAsNonRoot: true
        # User "nginx" bawaan image nginx-unprivileged.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: farhanrahman27/ice-stream-web:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Root filesystem read-only, tapi nginx tetap perlu menulis file
            # sementara (pid dan cache) ke /tmp. emptyDir = folder kosong
            # milik pod, hilang saat pod dihapus.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
