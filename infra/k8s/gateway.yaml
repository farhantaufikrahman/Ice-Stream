apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ice-stream-gateway
  namespace: ice-stream
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: ice-stream
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 4000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
