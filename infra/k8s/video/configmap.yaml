# Konfigurasi non-rahasia untuk VideoService.
# Password Oracle dari Secret oracle-credentials, kunci storage dari Secret
# storage-credentials (keduanya dibuat oleh kustomization.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: video-config
  namespace: ice-stream
  labels:
    app.kubernetes.io/name: video
    app.kubernetes.io/part-of: ice-stream
data:
  APP_ENV: production
  GRPC_PORT: "50052"
  SHUTDOWN_TIMEOUT: 10s
  DB_HOST: oracle
  DB_PORT: "1521"
  DB_SERVICE: FREEPDB1
  DB_USER: video_svc
  DB_MAX_OPEN_CONNS: "10"
  # Dipakai VideoService sendiri (nama Service RustFS di dalam cluster).
  STORAGE_ENDPOINT: http://storage:9000
  # Dipakai di URL upload/putar yang dibuka browser. Untuk sekarang lewat
  # port-forward (make k8s-forward-storage), jadi alamatnya localhost.
  STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
  STORAGE_REGION: us-east-1
  STORAGE_BUCKET: videos
  # Origin frontend yang boleh mengunggah langsung ke bucket.
  CORS_ALLOWED_ORIGINS: http://localhost:5173
  # Alamat publik file HLS dan thumbnail (lewat Gateway, storage/httproute.yaml).
  MEDIA_PUBLIC_URL: http://media.ice-stream.localhost:4000/videos
  # Antrean event ke transcoder (NATS JetStream).
  NATS_URL: nats://nats:4222
  MAX_UPLOAD_MB: "2048"
  UPLOAD_URL_TTL: 15m
  PLAYBACK_URL_TTL: 1h
