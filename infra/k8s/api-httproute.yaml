apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: ice-stream
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: ice-stream
spec:
  parentRefs:
    - name: ice-stream-gateway
  hostnames:
    - api.ice-stream.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 80
