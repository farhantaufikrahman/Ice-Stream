# Daftar manifest yang dipasang dengan `kubectl apply -k infra/k8s/`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - api-configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - gateway.yaml
  - api-httproute.yaml
  - oracle-service.yaml
  - oracle-statefulset.yaml

# Membuat Secret "oracle-credentials" dari file secrets/oracle.env
# (file itu tidak di-commit; contohnya ada di secrets/oracle.env.example).
secretGenerator:
  - name: oracle-credentials
    namespace: ice-stream
    envs:
      - secrets/oracle.env
    options:
      # Nama Secret tetap "oracle-credentials" (tanpa akhiran acak), supaya
      # Job migrasi yang dipasang terpisah bisa memakainya juga.
      disableNameSuffixHash: true
