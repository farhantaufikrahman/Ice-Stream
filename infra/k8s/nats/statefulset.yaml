# NATS dengan JetStream: antrean event antar service (misalnya
# "video selesai diunggah" dari VideoService ke transcoder).
# Padanannya di proyek lain: Kafka (seperti llama-express) atau RabbitMQ.
# NATS dipilih karena sangat ringan (beberapa MB RAM) dan ditulis dengan Go.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: ice-stream
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: ice-stream
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: ice-stream
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Sama seperti Oracle dan RustFS: hostpath Docker Desktop membuat
        # folder volume milik root, jadi pemiliknya diubah dulu.
        - name: fix-permissions
          image: busybox:1.37
          command: ["sh", "-c", "chown 1000:1000 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: nats
          image: nats:2.15.2-alpine
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/nats-config/nats.conf"]
          env:
            # NATS ditulis dengan Go: GOMEMLIMIT membuat garbage collector
            # bekerja lebih rajin sebelum mendekati batas memori container.
            - name: GOMEMLIMIT
              value: 200MiB
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/nats-config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: nats-config
  # PVC data-nats-0 menyimpan pesan JetStream; tidak ikut terhapus saat
  # StatefulSet dihapus.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: nats
          app.kubernetes.io/part-of: ice-stream
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
