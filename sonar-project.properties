# Konfigurasi analisis SonarQube Cloud (dibaca oleh job "sonar" di
# .github/workflows/ci.yml). sonar.organization dan sonar.projectKey TIDAK
# ditulis di sini: nilainya datang dari Variables repo GitHub
# (SONAR_ORGANIZATION, SONAR_PROJECT_KEY) supaya file ini sama untuk siapa pun.
#
# Dokumentasi: https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/

sonar.projectName=Ice-Stream

# Kode program (bukan tes).
sonar.sources=backend,frontend/src
sonar.exclusions=\
  backend/gen/**,\
  backend/migrations/**,\
  **/*_test.go,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  frontend/src/test/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**

# Kode tes: dihitung sebagai tes, bukan sebagai kode yang dianalisis.
sonar.tests=backend,frontend/src
sonar.test.inclusions=\
  **/*_test.go,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  frontend/src/test/**
sonar.test.exclusions=backend/gen/**

# Laporan coverage yang dibuat CI sebelum analisis.
#   backend : make test-coverage      -> backend/coverage.out
#   frontend: npm run test:coverage   -> frontend/coverage/lcov.info
sonar.go.coverage.reportPaths=backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# File hasil generate (gen/) dan entry point tidak perlu coverage.
sonar.coverage.exclusions=\
  backend/cmd/**,\
  frontend/src/main.tsx

sonar.sourceEncoding=UTF-8
